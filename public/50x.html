<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Estamos teniendo un problema · CENTYNELLA</title>
    <!-- Página estática: la sirve nginx cuando el propio servidor falla (500/502/503/504). No usa JavaScript ni recursos externos. -->
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        font-family:
          'Poppins',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Arial,
          sans-serif;
        color: #2b3037;
        background: linear-gradient(135deg, #6e6df8 0%, #6567ea 55%, #5c62d4 100%);
      }
      main {
        width: 100%;
        max-width: 560px;
        padding: 48px 32px;
        text-align: center;
        background: #ffffff;
        box-shadow: 0 12px 28px rgba(45, 40, 243, 0.18);
      }
      .code {
        margin: 0;
        font-size: clamp(4rem, 18vw, 6.5rem);
        font-weight: 700;
        line-height: 1;
        color: #2d28f3;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 24px;
        line-height: 1.6;
        color: #5b6270;
      }
      a {
        display: inline-block;
        padding: 10px 28px;
        font-weight: 600;
        color: #ffffff;
        text-decoration: none;
        background: #2d28f3;
        border-radius: 9999px;
      }
      a:hover {
        background: #4a46f5;
      }
      a:focus-visible {
        outline: 3px solid rgba(110, 109, 248, 0.6);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">:(</p>
      <h1>Estamos teniendo un problema</h1>
      <p>
        El servicio no está disponible en este momento. Ya lo estamos revisando; intenta de nuevo en
        unos minutos.
      </p>
      <a href="/">Reintentar</a>
    </main>
  </body>
</html>
