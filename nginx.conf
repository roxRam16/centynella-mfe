# CENTYNELLA-MFE · servidor estático del shell

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Cabeceras de seguridad básicas
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Sonda de salud para el balanceador / ECS
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Assets con hash en el nombre: cache larga e inmutable
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # remoteEntry (manifiesto de federación): nunca cachear, o los remotes quedarían desactualizados.
  # CORS abierto para que otros shells/remotes puedan consumirlo si hiciera falta.
  location ~* /remoteEntry.*\.js$ {
    add_header Cache-Control "no-store";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }

  # SPA: cualquier ruta cae en index.html (react-router resuelve en el cliente)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
